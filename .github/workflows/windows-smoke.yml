# packer-windows-jit-v1
# ng-runner-policy: private-jit-only-v1
name: Windows Smoke


run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'smoke', inputs.runner_pool || 'private', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'smoke', inputs.runner_pool || 'private') || format('action:ci:pool:private') }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Required workflow action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true
  pull_request:
    types: [labeled]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "*.sln"
      - ".github/workflows/windows-smoke.yml"

permissions:
  contents: read

jobs:
  dotnet:
    # Keep external fork code off trusted JIT groups until its isolated route is authorized.
    if: >-
      (
        (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
        contains(github.event.pull_request.labels.*.name, 'action:ci') &&
        contains(github.event.pull_request.labels.*.name, 'pool:private') &&
        github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.action == 'ci' &&
        inputs.runner_pool == 'private'
        )
      ) &&
      (
        github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","slskNet.Runtime","gha-{0}-dotnet"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore slskNet.Runtime.sln

      - name: Build
        run: dotnet build slskNet.Runtime.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test slskNet.Runtime.sln --configuration Release --no-build
