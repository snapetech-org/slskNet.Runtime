# ng-runner-policy: private-jit-only-v1
name: Build and test


run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      format('action:ci:pool:private:tag:{0}', github.ref_name) ||
      github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'build', inputs.runner_pool || 'private', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'build', inputs.runner_pool || 'private') || format('action:ci:pool:private') }}
on:

  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      action:
        description: Required workflow action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true

permissions:
  contents: read

jobs:
  build:
    # Keep external fork code off trusted JIT groups until its isolated route is authorized.
    if: >-
      (
        (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
        contains(github.event.pull_request.labels.*.name, 'action:ci') &&
        contains(github.event.pull_request.labels.*.name, 'pool:private') &&
        github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.action == 'ci' &&
        inputs.runner_pool == 'private'
        ) ||
        (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'workflow_dispatch')
      ) &&
      (
        github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slsknet.runtime","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore slskNet.Runtime.sln

      - name: Build
        run: dotnet build slskNet.Runtime.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Soulseek.Tests.Unit/Soulseek.Tests.Unit.csproj --configuration Release --no-build --no-restore
